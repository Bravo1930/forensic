services:
  ollama:
    image: ollama/ollama:latest
    container_name: forensic-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  app:
    build: .
    container_name: forensic-app
    ports:
      - "3000:3000"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=file:./data/forensic_legal.db
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2
      - LOCAL_BASE_URL=http://localhost:3000
      - LOCAL_UPLOAD_DIR=./uploads
      - JWT_SECRET=${JWT_SECRET:-change-this-to-a-random-secret-in-production}
      - ALLOWED_ORIGINS=http://localhost:3000
      - VITE_APP_ID=forensic-legal
      - VITE_OAUTH_PORTAL_URL=http://localhost:3000
      - OAUTH_SERVER_URL=http://localhost:3000
      - DEMO_MODE_ENABLED=${DEMO_MODE_ENABLED:-true}
      - RATE_LIMIT_FREE=30
      - RATE_LIMIT_PREMIUM=100
      - RATE_LIMIT_ENTERPRISE=300
      # Optional: set GEMINI_API_KEY to use Gemini instead of Ollama
      # - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - app_data:/app/data
      - uploads_data:/app/uploads
    restart: unless-stopped

volumes:
  ollama_data:
    driver: local
  app_data:
    driver: local
  uploads_data:
    driver: local
